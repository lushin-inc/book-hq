<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book HQ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='none' stroke='%232563EB' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' d='M12 6c-2-1.5-5-1.5-8 0v13c3-1.5 6-1.5 8 0 2-1.5 6-1.5 8 0V6c-3-1.5-6-1.5-8 0Z M12 6v13'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --cover:#EAEEF3;
  --ink:#171A21; --muted:#697386; --line:#E6E8EE;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 26px -14px rgba(16,24,40,.16);
  --shadow-hover:0 1px 2px rgba(16,24,40,.05), 0 22px 44px -18px rgba(16,24,40,.24);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #2563EB;outline-offset:3px;border-radius:12px}

/* header — quiet wordmark, no nav */
.top{display:flex;justify-content:center;padding:34px 20px 6px}
.brand{font-family:"Poppins";font-weight:600;font-size:17px;letter-spacing:.01em;color:var(--ink)}

/* shelf — centered, wraps as books are added */
.wrap{max-width:1080px;margin:0 auto;padding:30px 24px 80px}
.shelf{display:flex;flex-wrap:wrap;justify-content:center;gap:26px}

/* book tile */
.tile{
  width:260px;display:flex;flex-direction:column;gap:11px;
  transition:transform .16s ease;
}
.tile:hover{transform:translateY(-4px)}
.tile-cover{
  border-radius:14px;overflow:hidden;background:var(--cover);
  aspect-ratio:1/1;border:1px solid var(--line);box-shadow:var(--shadow);
  transition:box-shadow .16s ease;
}
.tile:hover .tile-cover{box-shadow:var(--shadow-hover)}
.tile-cover img{width:100%;height:100%;object-fit:cover;display:block}
.tile-meta{text-align:center;padding:0 4px}
.tile-title{font-family:"Poppins";font-weight:600;font-size:18px;line-height:1.28}
.tile-author{color:var(--muted);font-size:14px;margin-top:3px}

@media(max-width:600px){
  .tile{width:min(72vw,260px)}
  .top{padding-top:26px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top"><div class="brand">Book HQ</div></header>

<main class="wrap">
  <div class="shelf" id="shelf"></div>
</main>

<script>
/* ============================================================================
   BOOK HQ

   To add a book:
     1) Drop its folder in this directory (e.g.  the-next-book/ ), with the
        page saved as  the-next-book/index.html  and its cover at
        the-next-book/img/cover.png .
     2) Add ONE line to the BOOKS list below. "slug" is the folder name.

   That's it — the cover shows on this page and clicking it opens the book.
   (Optional per book: cover:"custom/path.jpg" or href:"custom/" to override.)
   ============================================================================ */
const BOOKS = [
  { slug:"chop-wood-carry-water", title:"Chop Wood Carry Water", author:"Joshua Medcalf" },
];

/* ---- render (you don't need to edit below) ---- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('shelf').innerHTML = BOOKS.map(b => {
  const href  = b.href  || (b.slug + '/');
  const cover = b.cover || (b.slug + '/img/cover.png');
  return `<a class="tile" href="${esc(href)}">
    <div class="tile-cover"><img src="${esc(cover)}" alt="${esc(b.title)} cover" loading="lazy"></div>
    <div class="tile-meta">
      <div class="tile-title">${esc(b.title)}</div>
      <div class="tile-author">${esc(b.author)}</div>
    </div>
  </a>`;
}).join('');
</script>
</body>
</html>
