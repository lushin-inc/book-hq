<script>
(function(){
  var root=document.documentElement, btn=document.getElementById('themebtn');
  function paint(){
    var d=root.getAttribute('data-theme')==='dark';
    var m=document.querySelector('meta[name=theme-color]');
    if(m) m.setAttribute('content', d?'#0D0F13':'#F4F5F7');
    btn.querySelector('.i-sun').style.display=d?'block':'none';
    btn.querySelector('.i-moon').style.display=d?'none':'block';
  }
  btn.addEventListener('click',function(){
    var d=root.getAttribute('data-theme')==='dark'?'light':'dark';
    root.setAttribute('data-theme',d);
    try{localStorage.setItem('sl-theme',d)}catch(e){}
    paint();
  });
  paint();
})();
</script>
