/* ── state ──────────────────────────────────────────── */
var VIEWS = ["start","insights","actions","reference","quick","images"];
var state = { view:"home", open:{}, actOpen:{}, done:{}, filter:"all", allOpen:false, light:-1 };
var HAVE = {};            /* which image files actually exist */
var PICS = [];            /* images present, in order — drives the lightbox */

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
function $(id){ return document.getElementById(id); }
function load(k,f){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):f; }catch(e){ return f; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

/* ── theme ──────────────────────────────────────────── */
$("themeBtn").addEventListener("click",function(){
  var next = document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme",next);
  try{ localStorage.setItem("ladder.theme", JSON.stringify(next).slice(1,-1)); }catch(e){}
});

/* ── image preflight: only show art that is actually in images/ ── */
var COVERS = ["cover.jpg","cover.png","cover.jpeg"];
function coverFile(){ for(var i=0;i<COVERS.length;i++){ if(HAVE[COVERS[i]]) return COVERS[i]; } return ""; }

function preflight(done){
  var files = COVERS.concat(DATA.IMAGES.map(function(i){return i.f;}));
  var left = files.length, timer = setTimeout(finish, 1500), finished = false;
  files.forEach(function(f){
    var im = new Image();
    im.onload = function(){ HAVE[f]=true; tick(); };
    im.onerror = tick;
    im.src = "images/"+f;
  });
  function tick(){ if(--left<=0) finish(); }
  function finish(){
    if(finished) return; finished = true; clearTimeout(timer);
    PICS = DATA.IMAGES.filter(function(i){ return HAVE[i.f]; });
    done();
  }
}
function picIndex(file){ for(var i=0;i<PICS.length;i++){ if(PICS[i].f===file) return i; } return -1; }

/* ── routing ────────────────────────────────────────── */
function syncHash(){
  var h = (location.hash||"").replace("#","");
  state.view = VIEWS.indexOf(h)>=0 ? h : "home";
}
window.addEventListener("hashchange",function(){ syncHash(); render(); window.scrollTo(0,0); });

/* ── nav ────────────────────────────────────────────── */
function renderNav(){
  $("nav").innerHTML = DATA.NAV.filter(function(n){
    return n.key!=="images" || PICS.length>0;
  }).map(function(n){
    return '<a href="'+n.href+'" class="'+(state.view===n.key?"on":"")+'">'+esc(n.label)+'</a>';
  }).join("");
}

/* ── views ──────────────────────────────────────────── */
function head(title){
  return '<div class="sechead"><div class="mark"></div><h2 class="sec-title">'+esc(title)+'</h2></div>';
}
function figureHTML(im,idx){
  return '<figure data-pic="'+idx+'"><img src="images/'+im.f+'" alt="'+esc(im.title)+'" loading="lazy">'+
         '<figcaption><strong>'+esc(im.title)+'</strong> &mdash; '+esc(im.caption)+'</figcaption></figure>';
}

function viewHome(){
  var cf = coverFile();
  var cover = cf ? '<img src="images/'+cf+'" alt="The Ladder of Divine Ascent">' : '';
  var strip = "";
  if(PICS.length){
    strip =
      '<div class="striphead"><div class="label" style="margin:0">Illustrations</div>'+
      '<div class="arrows"><button class="arrow" data-scroll="strip1:-1" aria-label="Scroll left">&lsaquo;</button>'+
      '<button class="arrow" data-scroll="strip1:1" aria-label="Scroll right">&rsaquo;</button></div></div>'+
      '<div class="strip" id="strip1">'+PICS.map(figureHTML).join("")+'</div>';
  }
  var tiles = DATA.TILES.filter(function(t){
    return t.href!=="#images" || PICS.length>0;
  }).map(function(t){
    var sec = t.href.replace("#","");
    return '<a class="tile sec-'+sec+'" href="'+t.href+'"><div class="t-title">'+esc(t.title)+'</div></a>';
  }).join("");
  return '<div class="wrap">'+
    '<div class="hero">'+cover+'<div class="hero-copy">'+
      '<h1 class="display">The Ladder of Divine Ascent</h1>'+
      '<div class="author">Saint John Climacus</div>'+
      '<p class="lede">A graduated climb of thirty rungs, each resting on the one beneath it. The insights, the action guide, and the reference pages, drawn from the Lazarus Moore translation.</p>'+
    '</div></div>'+ strip +
    '<div class="tiles">'+tiles+'</div></div>';
}

function viewStart(){
  var art = HAVE["01_one_rung_at_a_time.png"]
    ? '<img class="inline-art" src="images/01_one_rung_at_a_time.png" alt="One rung at a time" data-pic="'+picIndex("01_one_rung_at_a_time.png")+'" loading="lazy" style="margin-top:22px">'
    : '';
  var words = DATA.WORDS.map(function(w){
    return '<div class="card"><div class="item-title" style="margin-bottom:10px">'+esc(w.t)+'</div><p class="body" style="font-size:16px">'+esc(w.d)+'</p></div>';
  }).join("");
  var movs = DATA.MOV.map(function(m,i){
    return '<a class="movrow" href="#insights" data-filter="m'+i+'"><div class="num">'+esc(m.n)+'</div><div style="flex:1">'+
      '<div class="mt">'+esc(m.title)+'</div><div class="ms">'+esc(m.steps)+'</div><p>'+esc(m.blurb)+'</p></div></a>';
  }).join("");
  return '<div class="wrap sec-start">'+ head("Start Here")+
      '<div class="grid-auto" style="margin-bottom:14px">'+
        '<div class="card"><div class="label">The central question</div><p class="body" style="color:var(--ink);font-size:19px;line-height:1.45;letter-spacing:-.015em">What is the actual, ordered sequence of interior change that carries a person from a life ruled by the passions to a life ruled by love?</p></div>'+
        '<div class="card"><div class="label">The central answer</div><p class="body">A graduated climb of thirty rungs, each resting on the one beneath it, in which practices break attachment, virtues displace vices, and humility acts as the hinge on which the whole structure turns. No one climbs it in a single stride, and no one climbs it alone.</p></div>'+
      '</div>'+
      '<div class="card" style="margin-bottom:46px"><div class="label">Why the order matters</div>'+
        '<p class="body" style="margin-bottom:16px">John borrowed his image from Genesis, where Jacob sleeps at Bethel and sees a ladder set on the earth with its top reaching heaven. His ladder has thirty rungs, one for each year of Christ&rsquo;s hidden life before his baptism, and each rung takes a single subject: a thing to leave, a vice to fight, a virtue to acquire, or a state that can only be given.</p>'+
        '<p class="body">The ordering is the whole architecture. Obedience produces humility; humility produces discernment; discernment produces insight, and insight foresight. Anger fathers resentment, resentment fathers slander, slander needs talkativeness as its door, and talkativeness gives birth to despondency. If the order is real, then a man who attacks his pride while leaving his stomach and his tongue alone is wasting his effort.</p>'+ art +
      '</div>'+
      '<div class="h2">Six Words You Will Need</div>'+
      '<p class="intro">John writes in a technical vocabulary his original readers already knew. Without it, several of his most important sentences slide past.</p>'+
      '<div class="grid-auto" style="margin-bottom:46px">'+words+'</div>'+
      '<div class="h2">The Five Movements</div>'+
      '<div class="stack">'+movs+'</div>'+
    '</div>';
}

function viewInsights(){
  var filters = [{k:"all",label:"All"}].concat(DATA.MOV.map(function(m,i){ return {k:"m"+i,label:m.title}; }));
  var pills = filters.map(function(f){
    return '<button class="pill '+(state.filter===f.k?"on":"")+'" data-pick="'+f.k+'">'+esc(f.label)+'</button>';
  }).join("")+
  '<button class="pill ghost" data-toggleall="1">'+(state.allOpen?"Collapse all":"Expand all")+'</button>';

  var body = DATA.MOV.map(function(m,mi){
    if(state.filter!=="all" && state.filter!=="m"+mi) return "";
    var cards = m.ins.map(function(c,ci){
      var id = mi+"-"+ci, open = !!state.open[id];
      var art = (c.img && HAVE[c.img])
        ? '<img class="inline-art" src="images/'+c.img+'" alt="'+esc(c.t)+'" data-pic="'+picIndex(c.img)+'" loading="lazy">'
        : '';
      return '<div class="item">'+
        '<div class="item-head" data-open="'+id+'"><div style="flex:1">'+
          '<div class="item-title">'+esc(c.t)+'</div><div class="item-pull">'+esc(c.p)+'</div></div>'+
          '<div class="plus">'+(open?"&minus;":"+")+'</div></div>'+
        (open ? '<div class="item-body">'+
          '<div><div class="label">What it is</div><p>'+esc(c.w)+'</p></div>'+
          '<div><div class="label">Why it matters</div><p>'+esc(c.y)+'</p></div>'+
          '<div class="example"><div class="label">The strongest example</div><p>'+esc(c.e)+'</p></div>'+
          '<div><div class="label">What it changes in practice</div><p>'+esc(c.c)+'</p></div>'+ art +
        '</div>' : '')+
      '</div>';
    }).join("");
    return '<div style="margin-bottom:46px"><div class="movhead"><div class="num">'+esc(m.n)+'</div><div>'+
      '<div class="mt">'+esc(m.title)+'</div><div class="ms">'+esc(m.steps)+'</div></div></div>'+
      '<div class="stack">'+cards+'</div></div>';
  }).join("");

  return '<div class="sec-insights">'+
    '<div class="wrap">'+head("The Insights")+'</div>'+
    '<div class="filters">'+pills+'</div>'+
    '<div class="wrap">'+body+'</div></div>';
}

function viewActions(){
  var total=0, done=0;
  DATA.PHASES.forEach(function(ph,pi){ ph.acts.forEach(function(a,ai){ total++; if(state.done["a"+pi+"-"+ai]) done++; }); });
  var pct = total ? Math.round(done/total*100) : 0;

  var body = DATA.PHASES.map(function(ph,pi){
    var acts = ph.acts.map(function(a,ai){
      var id="a"+pi+"-"+ai, isDone=!!state.done[id], open=!!state.actOpen[id];
      return '<div class="item">'+
        '<div class="act-head">'+
          '<button class="check '+(isDone?"done":"")+'" data-check="'+id+'" aria-label="Mark done">&#10003;</button>'+
          '<div class="act-title '+(isDone?"done":"")+'" data-act="'+id+'">'+esc(a.t)+'</div>'+
          '<div class="plus" data-act="'+id+'" style="cursor:pointer">'+(open?"&minus;":"+")+'</div>'+
        '</div>'+
        (open ? '<div class="act-body">'+
          '<div><div class="label">When to use it</div><p>'+esc(a.when)+'</p></div>'+
          '<div><div class="label">The problem it addresses</div><p>'+esc(a.prob)+'</p></div>'+
          '<div><div class="label">What success looks like</div><p>'+esc(a.win)+'</p></div>'+
          '<div class="caution"><div class="label">Caution</div><p>'+esc(a.caution)+'</p></div>'+
        '</div>' : '')+
      '</div>';
    }).join("");
    return '<div style="margin-bottom:46px"><div class="phasehead"><div class="pt">'+esc(ph.title)+'</div><p>'+esc(ph.blurb)+'</p></div>'+
      '<div class="stack">'+acts+'</div></div>';
  }).join("");

  return '<div class="sec-actions">'+
    '<div class="wrap">'+head("The Action Guide")+'</div>'+
    '<div class="progressrow"><div class="track"><div class="fill" style="width:'+pct+'%"></div></div>'+
    '<div class="plabel">'+done+' of '+total+'</div>'+
    '<button class="clear" data-clear="1">Clear</button></div>'+
    '<div class="wrap">'+body+'</div></div>';
}

function viewReference(){
  var defs = DATA.DEFS.map(function(d){
    return '<div class="defrow"><div class="dt">'+esc(d.t)+'</div><p>'+esc(d.d)+'</p></div>';
  }).join("");
  var dist = DATA.DISTINCTIONS.map(function(d){
    return '<div class="dist"><div class="dt">'+esc(d.t)+'</div><p>'+esc(d.d)+'</p></div>';
  }).join("");
  var stories = DATA.STORIES.map(function(s){
    return '<div class="defrow wide"><div class="dt">'+esc(s.t)+'</div><p>'+esc(s.d)+'</p></div>';
  }).join("");
  return '<div class="wrap sec-reference">'+head("Reference")+
      '<div class="h2">Definitions</div>'+
      '<p class="intro">John defines by accumulation, heaping clauses until the thing is surrounded. These are condensed to their load-bearing phrases.</p>'+
      '<div class="stack" style="margin-bottom:46px">'+defs+'</div>'+
      '<div class="h2">Distinctions Worth Holding</div>'+
      '<div class="grid-auto" style="margin-bottom:46px">'+dist+'</div>'+
      '<div class="h2">The Stories Worth Keeping</div>'+
      '<p class="intro">Step Four carries John&rsquo;s field reporting from a monastery near Alexandria, where he stayed, watched, and asked questions of everyone.</p>'+
      '<div class="stack">'+stories+'</div>'+
    '</div>';
}

function viewQuick(){
  var rungs = DATA.RUNGS.map(function(t,i){
    return '<div class="rung"><div class="n">'+(i+1)+'</div><div class="t">'+esc(t)+'</div></div>';
  }).join("");
  var pr = DATA.PRINCIPLES.map(function(t,i){
    return '<div class="principle"><div class="n">'+(i+1)+'</div><div class="t">'+esc(t)+'</div></div>';
  }).join("");
  return '<div class="wrap sec-quick">'+head("Quick Reference")+
      '<div class="h2">The Thirty Rungs</div>'+
      '<div class="rungs" style="margin-bottom:46px">'+rungs+'</div>'+
      '<div class="h2">The Principles</div>'+
      '<div class="stack">'+pr+'</div>'+
    '</div>';
}

function viewImages(){
  return '<div class="wrap sec-images">'+head("Illustrations")+
      '<div class="strip big" id="strip2">'+PICS.map(figureHTML).join("")+'</div>'+
      '<div class="gallery">'+PICS.map(figureHTML).join("")+'</div>'+
    '</div>';
}

/* ── lightbox ───────────────────────────────────────── */
function renderLight(){
  var i = state.light;
  if(i<0 || !PICS.length){ $("lb").innerHTML=""; return; }
  var im = PICS[i];
  $("lb").innerHTML =
    '<div class="lightbox" data-close="1">'+
      '<img src="images/'+im.f+'" alt="'+esc(im.title)+'">'+
      '<div class="cap"><strong>'+esc(im.title)+'</strong> &mdash; '+esc(im.caption)+'</div>'+
      '<div class="ctrls">'+
        '<button class="lb-btn" data-step="-1" aria-label="Previous">&lsaquo;</button>'+
        '<div class="lb-count">'+(i+1)+' / '+PICS.length+'</div>'+
        '<button class="lb-btn" data-step="1" aria-label="Next">&rsaquo;</button>'+
      '</div>'+
      '<button class="lb-btn lb-close" data-close="1" aria-label="Close">&#10005;</button>'+
    '</div>';
}
document.addEventListener("keydown",function(e){
  if(state.light<0) return;
  if(e.key==="Escape"){ state.light=-1; renderLight(); }
  if(e.key==="ArrowRight"){ state.light=(state.light+1)%PICS.length; renderLight(); }
  if(e.key==="ArrowLeft"){ state.light=(state.light-1+PICS.length)%PICS.length; renderLight(); }
});

/* ── events ─────────────────────────────────────────── */
document.addEventListener("click",function(e){
  var t = e.target;

  var step = t.closest("[data-step]");
  if(step){ state.light=(state.light+ +step.getAttribute("data-step")+PICS.length)%PICS.length; renderLight(); return; }
  var close = t.closest("[data-close]");
  if(close){ state.light=-1; renderLight(); return; }

  var pic = t.closest("[data-pic]");
  if(pic){ var n=+pic.getAttribute("data-pic"); if(n>=0){ state.light=n; renderLight(); } return; }

  var scroll = t.closest("[data-scroll]");
  if(scroll){
    var parts = scroll.getAttribute("data-scroll").split(":"), el = $(parts[0]);
    if(el) el.scrollBy({ left: (+parts[1]) * Math.min(el.clientWidth*0.85, 700), behavior:"smooth" });
    return;
  }

  var pick = t.closest("[data-pick]");
  if(pick){ state.filter = pick.getAttribute("data-pick"); render(); return; }

  if(t.closest("[data-toggleall]")){
    state.allOpen = !state.allOpen;
    state.open = {};
    if(state.allOpen) DATA.MOV.forEach(function(m,mi){ m.ins.forEach(function(c,ci){ state.open[mi+"-"+ci]=true; }); });
    render(); return;
  }

  var op = t.closest("[data-open]");
  if(op){ var id=op.getAttribute("data-open"); state.open[id]=!state.open[id]; render(); return; }

  var ck = t.closest("[data-check]");
  if(ck){
    var cid = ck.getAttribute("data-check");
    if(state.done[cid]) delete state.done[cid]; else state.done[cid]=1;
    save("ladder.done", state.done); render(); return;
  }
  var ac = t.closest("[data-act]");
  if(ac){ var aid=ac.getAttribute("data-act"); state.actOpen[aid]=!state.actOpen[aid]; render(); return; }

  if(t.closest("[data-clear]")){ state.done={}; save("ladder.done",{}); render(); return; }

  var mf = t.closest("[data-filter]");
  if(mf){ state.filter = mf.getAttribute("data-filter"); }
});

/* ── render ─────────────────────────────────────────── */
function render(){
  renderNav();
  var html;
  switch(state.view){
    case "start": html=viewStart(); break;
    case "insights": html=viewInsights(); break;
    case "actions": html=viewActions(); break;
    case "reference": html=viewReference(); break;
    case "quick": html=viewQuick(); break;
    case "images": html=PICS.length?viewImages():viewHome(); break;
    default: html=viewHome();
  }
  $("app").innerHTML = html;
}

state.done = load("ladder.done",{});
syncHash();
preflight(render);
</script>
