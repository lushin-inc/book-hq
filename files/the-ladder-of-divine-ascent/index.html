<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Ladder of Divine Ascent — A Study Companion</title>
<meta name="description" content="A study companion to The Ladder of Divine Ascent by Saint John Climacus: the insights, the action guide, and reference pages.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23161618'/%3E%3Cg stroke='%23f5f5f7' stroke-width='2' stroke-linecap='round' opacity='.9'%3E%3Cpath d='M11 26V7M21 26V7'/%3E%3Cpath d='M11 21.5h10M11 16.5h10M11 11.5h10'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  /* set theme before first paint so there is no flash */
  (function () {
    var t = "dark";
    try { var s = localStorage.getItem("ladder.theme"); if (s === "light" || s === "dark") t = s; } catch (e) {}
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
:root{
  --bg:#0a0a0b;
  --surface:#161618;
  --surface-2:#1e1e21;
  --hairline:rgba(255,255,255,.09);
  --ink:#f5f5f7;
  --ink-2:#a6a6ab;
  --ink-3:#77777d;
  --topbar:rgba(10,10,11,.72);
  --card-shadow:none;
  --tile-shadow:none;
  --art-bg:#f2f2f4;
  --art-filter:brightness(.92) contrast(1.02);
  --invert-bg:#f5f5f7;
  --invert-ink:#0a0a0b;
}
[data-theme="light"]{
  --bg:#f5f5f7;
  --surface:#ffffff;
  --surface-2:#ffffff;
  --hairline:rgba(0,0,0,.10);
  --ink:#1d1d1f;
  --ink-2:#515154;
  --ink-3:#86868b;
  --topbar:rgba(245,245,247,.78);
  --card-shadow:0 1px 2px rgba(0,0,0,.04), 0 10px 30px rgba(0,0,0,.05);
  --tile-shadow:0 1px 2px rgba(0,0,0,.05), 0 14px 34px rgba(0,0,0,.09);
  --art-bg:#ffffff;
  --art-filter:none;
  --invert-bg:#1d1d1f;
  --invert-ink:#ffffff;
}

/* section identity — one colour per section, used flat */
.sec-start    { --c:#7d5440; --cm:#c08a62; }
.sec-insights { --c:#8a6e36; --cm:#c9a45a; }
.sec-actions  { --c:#8e4038; --cm:#d07c6e; }
.sec-reference{ --c:#4f6b4a; --cm:#86a87c; }
.sec-quick    { --c:#46527a; --cm:#8494c6; }
.sec-images   { --c:#2e6265; --cm:#6baaad; }
[data-theme="light"] .sec-start,[data-theme="light"] .sec-insights,[data-theme="light"] .sec-actions,
[data-theme="light"] .sec-reference,[data-theme="light"] .sec-quick,[data-theme="light"] .sec-images{ --cm:var(--c); }

*{box-sizing:border-box;-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;
  font-size:17px; line-height:1.55; letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  min-height:100vh; padding-bottom:100px;
  transition:background .3s ease, color .3s ease;
}
img{max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;border:none;background:none}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
.hide{display:none !important}

/* ── top bar ─────────────────────────────────────────── */
.topbar{position:sticky;top:0;z-index:40;background:var(--topbar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--hairline)}
.topbar-in{max-width:1040px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:10px}
.nav{flex:1;min-width:0;display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;color:var(--ink-3);transition:color .2s ease,background .2s ease}
.nav a:hover{color:var(--ink)}
.nav a.on{background:var(--surface-2);color:var(--ink)}
[data-theme="light"] .nav a.on{background:rgba(0,0,0,.06)}
.speechify{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:7px 15px;border-radius:999px;background:var(--invert-bg);color:var(--invert-ink);font-size:14px;font-weight:500;letter-spacing:-.01em;transition:opacity .2s ease}
.speechify:hover{opacity:.82;color:var(--invert-ink)}
.iconbtn{flex:0 0 auto;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:999px;color:var(--ink-3);cursor:pointer;padding:0;transition:color .2s ease}
.iconbtn:hover{color:var(--ink)}
.iconbtn svg{width:17px;height:17px;display:block}
[data-theme="dark"] .i-sun{display:block}
[data-theme="dark"] .i-moon{display:none}
[data-theme="light"] .i-sun{display:none}
[data-theme="light"] .i-moon{display:block}

/* ── type ────────────────────────────────────────────── */
h1,h2,h3{margin:0;font-weight:600}
.display{font-size:clamp(34px,5vw,50px);line-height:1.06;letter-spacing:-.035em}
.sec-title{font-size:clamp(30px,4.4vw,40px);line-height:1.1;letter-spacing:-.032em}
.h2{font-size:26px;line-height:1.2;letter-spacing:-.025em;font-weight:600;margin:0 0 18px}
.lede{font-size:19px;line-height:1.5;letter-spacing:-.015em;color:var(--ink-2)}
.body{font-size:17px;line-height:1.55;color:var(--ink-2);margin:0;text-wrap:pretty}
.label{font-size:12px;font-weight:600;letter-spacing:.055em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.intro{font-size:17px;line-height:1.5;color:var(--ink-3);max-width:62ch;margin:-6px 0 22px}

/* ── section header ──────────────────────────────────── */
.sechead{padding:56px 0 30px}
.mark{width:38px;height:4px;border-radius:999px;background:var(--cm);margin-bottom:20px}

/* ── surfaces ────────────────────────────────────────── */
.card{background:var(--surface);border-radius:18px;padding:26px;box-shadow:var(--card-shadow)}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.stack{display:grid;gap:8px}

/* ── home ────────────────────────────────────────────── */
.hero{display:flex;flex-wrap:wrap;gap:44px;align-items:center;margin:56px 0 52px}
.hero img{width:clamp(180px,36vw,280px);border-radius:12px;display:block;box-shadow:var(--tile-shadow)}
.hero-copy{flex:1;min-width:280px}
.hero .author{margin-top:12px;font-size:21px;letter-spacing:-.02em;color:var(--ink-3)}
.hero p{margin:22px 0 0;max-width:48ch}
.striphead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.arrows{display:flex;gap:6px}
.arrow{width:30px;height:30px;border-radius:999px;background:var(--surface);color:var(--ink-3);font-size:15px;cursor:pointer;box-shadow:var(--card-shadow);transition:color .2s ease}
.arrow:hover{color:var(--ink)}
.strip{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;padding-bottom:14px;margin-bottom:52px}
.strip figure{flex:0 0 auto;width:min(80vw,420px);margin:0;scroll-snap-align:center;cursor:zoom-in}
figure img{width:100%;display:block;border-radius:12px;background:var(--art-bg);filter:var(--art-filter);transition:filter .25s ease}
figure:hover img{filter:none}
figcaption{margin-top:10px;font-size:14px;line-height:1.45;color:var(--ink-3)}
figcaption strong{color:var(--ink-2);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.tile{display:flex;align-items:flex-end;min-height:210px;padding:26px;border-radius:22px;background:var(--c);color:#fff;box-shadow:var(--tile-shadow);transition:transform .25s cubic-bezier(.2,.7,.3,1),filter .25s ease}
.tile:hover{color:#fff;transform:translateY(-3px);filter:brightness(1.08)}
.tile .t-title{font-size:27px;font-weight:600;line-height:1.15;letter-spacing:-.025em}

/* ── rows ────────────────────────────────────────────── */
.movrow{display:flex;gap:20px;align-items:flex-start;background:var(--surface);border-radius:18px;padding:22px 24px;box-shadow:var(--card-shadow);transition:transform .2s ease}
.movrow:hover{transform:translateY(-1px)}
.movrow .num{font-size:15px;font-weight:600;color:var(--ink-3);letter-spacing:-.01em;padding-top:3px;min-width:44px}
.movrow .mt{font-size:21px;font-weight:600;letter-spacing:-.02em}
.movrow .ms{font-size:14px;color:var(--ink-3);margin-top:4px}
.movrow p{margin:10px 0 0;font-size:16px;line-height:1.5;color:var(--ink-2)}

/* ── insights ────────────────────────────────────────── */
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;max-width:1040px;margin:0 auto;padding:0 24px 24px}
.pill{padding:7px 14px;border-radius:999px;font-size:14px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;cursor:pointer;background:var(--surface);color:var(--ink-2);box-shadow:var(--card-shadow);transition:background .2s ease,color .2s ease}
.pill:hover{color:var(--ink)}
.pill.on{background:var(--c);color:#fff}
.pill.ghost{margin-left:auto;background:transparent;box-shadow:none;color:var(--ink-3)}
.pill.ghost:hover{color:var(--ink)}
.movhead{display:flex;gap:20px;align-items:baseline;padding:0 4px 14px;margin-bottom:12px;border-bottom:1px solid var(--hairline)}
.movhead .num{font-size:14px;font-weight:600;color:var(--ink-3);min-width:44px}
.movhead .mt{font-size:22px;font-weight:600;letter-spacing:-.022em;line-height:1.2}
.movhead .ms{font-size:14px;color:var(--ink-3);margin-top:4px}
.item{background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--card-shadow)}
.item-head{display:flex;gap:18px;align-items:flex-start;padding:22px 24px;cursor:pointer}
.item-title{font-size:20px;font-weight:600;line-height:1.25;letter-spacing:-.022em}
.item-pull{margin-top:8px;font-size:16px;line-height:1.45;color:var(--cm)}
.plus{flex:0 0 auto;width:26px;height:26px;border-radius:999px;background:var(--surface-2);color:var(--ink-3);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;transition:color .2s ease,background .2s ease}
[data-theme="light"] .plus{background:rgba(0,0,0,.05)}
.item-head:hover .plus{color:var(--ink)}
.item-body{padding:0 24px 26px;display:grid;gap:22px}
.item-body p{margin:0;font-size:17px;line-height:1.55;color:var(--ink-2);text-wrap:pretty}
.example{border-left:2px solid var(--cm);padding-left:18px}
.example p{color:var(--ink)}
.inline-art{width:100%;display:block;border-radius:12px;background:var(--art-bg);filter:var(--art-filter);cursor:zoom-in;transition:filter .25s ease}
.inline-art:hover{filter:none}

/* ── actions ─────────────────────────────────────────── */
.progressrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1040px;margin:0 auto;padding:0 24px 26px}
.track{flex:1;min-width:180px;height:5px;border-radius:999px;background:var(--hairline);overflow:hidden}
.fill{height:100%;border-radius:999px;background:var(--ink);opacity:.85;transition:width .35s cubic-bezier(.2,.7,.3,1)}
.plabel{font-size:14px;font-weight:500;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.clear{padding:6px 12px;border-radius:999px;font-size:14px;font-weight:500;cursor:pointer;color:var(--ink-3);transition:color .2s ease}
.clear:hover{color:var(--ink)}
.phasehead{padding:0 4px 14px;margin-bottom:12px;border-bottom:1px solid var(--hairline)}
.phasehead .pt{font-size:22px;font-weight:600;letter-spacing:-.022em}
.phasehead p{margin:8px 0 0;font-size:16px;line-height:1.5;color:var(--ink-3);max-width:68ch}
.act-head{display:flex;gap:16px;align-items:flex-start;padding:20px 24px}
.check{flex:0 0 auto;width:24px;height:24px;margin-top:2px;border-radius:999px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:transparent;transition:background .2s ease,color .2s ease}
[data-theme="light"] .check{background:rgba(0,0,0,.06)}
.check:hover{background:var(--hairline)}
.check.done{background:var(--ink);color:var(--bg)}
.act-title{flex:1;cursor:pointer;font-size:17px;font-weight:500;line-height:1.45;letter-spacing:-.015em;transition:color .2s ease}
.act-title.done{color:var(--ink-3);text-decoration:line-through}
.act-body{padding:0 24px 26px 64px;display:grid;gap:20px}
.act-body p{margin:0;font-size:17px;line-height:1.55;color:var(--ink-2)}
.caution{border-left:2px solid var(--cm);padding-left:18px}

/* ── reference / quick ───────────────────────────────── */
.defrow{display:flex;flex-wrap:wrap;gap:4px 24px;background:var(--surface);border-radius:16px;padding:20px 24px;box-shadow:var(--card-shadow)}
.defrow .dt{flex:0 0 auto;width:170px;font-size:17px;font-weight:600;letter-spacing:-.018em;line-height:1.4}
.defrow.wide .dt{width:210px}
.defrow p{flex:1;min-width:240px;margin:0;font-size:16px;line-height:1.55;color:var(--ink-2);text-wrap:pretty}
.dist{background:var(--surface);border-radius:16px;padding:22px 24px;box-shadow:var(--card-shadow)}
.dist .dt{font-size:16px;font-weight:600;margin-bottom:8px;color:var(--cm);letter-spacing:-.012em}
.dist p{margin:0;font-size:16px;line-height:1.55;color:var(--ink-2);text-wrap:pretty}
.rungs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2px 32px}
.rung{display:flex;gap:16px;align-items:baseline;padding:11px 4px;border-bottom:1px solid var(--hairline)}
.rung .n{flex:0 0 auto;width:22px;text-align:right;font-size:14px;font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rung .t{flex:1;font-size:16px;line-height:1.45;color:var(--ink-2)}
.principle{display:flex;gap:18px;align-items:baseline;background:var(--surface);border-radius:16px;padding:18px 22px;box-shadow:var(--card-shadow)}
.principle .n{flex:0 0 auto;width:22px;font-size:14px;font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
.principle .t{flex:1;font-size:17px;line-height:1.5;text-wrap:pretty}

/* ── images ──────────────────────────────────────────── */
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.gallery figure{margin:0;cursor:zoom-in}
.strip.big figure{width:min(88vw,700px)}

/* ── lightbox ────────────────────────────────────────── */
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(6,6,7,.86);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.lightbox img{max-width:100%;max-height:76vh;object-fit:contain;border-radius:12px;background:#fff}
.lightbox .cap{margin-top:18px;color:#f5f5f7;font-size:15px;text-align:center;max-width:60ch}
.lightbox .cap strong{font-weight:600}
.lightbox .ctrls{margin-top:20px;display:flex;gap:10px;align-items:center}
.lb-btn{width:42px;height:42px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font-size:18px;cursor:pointer;transition:background .2s ease}
.lb-btn:hover{background:rgba(255,255,255,.22)}
.lb-count{color:rgba(245,245,247,.6);font-size:14px;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.lb-close{position:absolute;top:20px;right:20px}

/* ── footer ──────────────────────────────────────────── */
.foot{max-width:1040px;margin:72px auto 0;padding:0 24px;font-size:14px;line-height:1.5;color:var(--ink-3)}

@media (max-width:640px){
  body{font-size:16px}
  .wrap,.topbar-in,.filters,.progressrow,.foot{padding-left:18px;padding-right:18px}
  .sechead{padding:38px 0 24px}
  .hero{margin:36px 0 40px;gap:28px}
  .tile{min-height:150px;padding:22px}
  .tile .t-title{font-size:24px}
  .card,.item-head,.act-head{padding-left:20px;padding-right:20px}
  .item-body,.act-body{padding-left:20px;padding-right:20px}
  .defrow .dt,.defrow.wide .dt{width:100%}
  .movrow .num,.movhead .num{min-width:0}
}
</style>
</head>
